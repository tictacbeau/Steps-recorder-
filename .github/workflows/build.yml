name: Build & Release

on:
  push:
    branches: ["**"]
    tags:     ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (win-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore StepsRecorder.sln

      - name: Build
        run: dotnet build StepsRecorder.sln -c Release --no-restore

      - name: Test
        run: dotnet test src/Tests/Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: Download ffmpeg
        shell: pwsh
        run: |
          $zip = "$env:TEMP\ffmpeg.zip"
          $out = "$env:TEMP\ffmpeg-out"
          Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zip -UseBasicParsing
          Expand-Archive $zip -DestinationPath $out -Force
          $exe = Get-ChildItem $out -Recurse -Filter ffmpeg.exe | Where-Object { $_.FullName -like "*\bin\*" } | Select-Object -First 1
          New-Item tools -ItemType Directory -Force | Out-Null
          Copy-Item $exe.FullName tools\ffmpeg.exe
          Write-Host "ffmpeg ready"

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/App/App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o dist
          Copy-Item tools\ffmpeg.exe dist\ffmpeg.exe
          Copy-Item settings.template.json dist\settings.template.json

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath StepsRecorder-portable-win-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StepsRecorder-portable-win-x64
          path: StepsRecorder-portable-win-x64.zip
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: StepsRecorder-portable-win-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
